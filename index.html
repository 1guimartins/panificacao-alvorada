<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panificação Alvorada - Visão Geral de Produção</title>
  <style>
    :root {
      --verde-alvorada: #007a33;
      --verde-escuro: #005624;
      --bg-fundo: #f4f6f8;
      --cinza-escuro: #1e293b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-fundo);
      margin: 0;
      padding: 15px;
    }
    .header {
      background: linear-gradient(135deg, var(--verde-alvorada), var(--verde-escuro));
      color: white;
      padding: 15px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .header h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
    .btn-admin {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }
    .btn-admin:hover { background: rgba(255, 255, 255, 0.3); }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      border: 1px solid #e2e8f0;
    }
    .card h2 { margin-top: 0; color: var(--cinza-escuro); font-size: 18px; border-bottom: 2px solid var(--verde-alvorada); padding-bottom: 8px; }
    
    .tabela-producao {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
    }
    .tabela-producao th {
      background-color: var(--cinza-escuro);
      color: white;
      padding: 12px;
      text-align: left;
    }
    .tabela-producao td {
      padding: 10px 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .tabela-producao tr:nth-child(even) { background-color: #f8fafc; }
    
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-sucesso { background: #dcfce7; color: #15803d; }
    .badge-perda { background: #ffe4e6; color: #be123c; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🥐 Panificação Alvorada — Monitoramento Geral</h1>
    <a href="admin.html" class="btn-admin">⚙️ Painel Admin</a>
  </div>

  <div class="card">
    <h2>📋 Acompanhamento Diário de Produção</h2>
    <div style="overflow-x: auto;">
      <table class="tabela-producao">
        <thead>
          <tr>
            <th>Data</th>
            <th>Líder Responsável</th>
            <th>Produto</th>
            <th>Meta</th>
            <th>Produzido</th>
            <th>Embalado</th>
            <th>Perda / Dif.</th>
          </tr>
        </thead>
        <tbody id="tabelaGeralProducao">
          <tr><td colspan="7" style="text-align:center; color:#64748b;">Carregando dados...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-KGrSWvIAKW6ZT0SDGUH7LFLzvYsmcJk",
      authDomain: "panificacao-alvorada.firebaseapp.com",
      databaseURL: "https://panificacao-alvorada-default-rtdb.firebaseio.com",
      projectId: "panificacao-alvorada",
      storageBucket: "panificacao-alvorada.firebasestorage.app",
      messagingSenderId: "537626588403",
      appId: "1:537626588403:web:8bd808f903fe33b422f386"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Carrega todos os registros diários em tempo real
    onValue(ref(db, 'produtos_diarios'), (snapshot) => {
      const dados = snapshot.val();
      const tbody = document.getElementById('tabelaGeralProducao');
      tbody.innerHTML = '';

      if (!dados) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#64748b;">Nenhum registro encontrado. Cadastre no Painel Admin.</td></tr>';
        return;
      }

      // Converte em lista e ordena pela data mais recente
      const lista = Object.values(dados).sort((a, b) => new Date(b.data) - new Date(a.data));

      lista.forEach(item => {
        const tr = document.createElement('tr');
        const un = item.unidade || 'un';
        
        tr.innerHTML = `
          <td><strong>${item.data || '-'}</strong></td>
          <td>${item.lider || '-'}</td>
          <td><strong>${item.nome}</strong></td>
          <td>${item.qtdMeta || 0} ${un}</td>
          <td><span class="badge badge-sucesso">${item.qtdFeita || 0} ${un}</span></td>
          <td>${item.qtdEmbalada || 0} ${un}</td>
          <td><span class="badge badge-perda">${item.qtdPerda || 0} ${un}</span></td>
        `;
        tbody.appendChild(tr);
      });
    });
  </script>
</body>
</html>
