<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panificação Alvorada</title>
  <style>
    :root {
      --verde-alvorada: #007a33;
      --verde-escuro: #005624;
      --laranja-alvorada: #f39c12;
      --bg-fundo: #f4f6f8;
    }

    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-fundo); margin: 0; padding: 12px; }

    .brand-header {
      background: linear-gradient(135deg, var(--verde-alvorada), var(--verde-escuro));
      color: white; padding: 15px; border-radius: 12px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15); margin-bottom: 12px;
    }

    .brand-title { font-size: 18px; font-weight: bold; letter-spacing: 1px; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center;
      z-index: 1000; padding: 15px;
    }

    .modal-box { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 350px; text-align: center; }
    .modal-box select { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    .modal-box button { width: 100%; padding: 12px; background: var(--verde-alvorada); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }

    .lider-bar {
      background: white; padding: 10px 15px; border-radius: 8px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; border-left: 5px solid var(--laranja-alvorada);
      box-shadow: 0 2px 5px rgba(0,0,0,0.05); flex-wrap: wrap; gap: 8px;
    }

    .data-semana-box {
      background: white; padding: 10px 15px; border-radius: 8px;
      margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-size: 13px; font-weight: bold; color: #333;
    }

    .data-semana-box input[type="date"] {
      padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; font-weight: bold;
    }

    .dias-bar {
      display: flex; gap: 8px; overflow-x: auto;
      padding-bottom: 8px; margin-bottom: 15px;
      -webkit-overflow-scrolling: touch;
    }

    .btn-dia {
      background-color: white; color: #333; border: 1px solid #ddd;
      padding: 10px 14px; border-radius: 20px; font-size: 13px; font-weight: bold;
      white-space: nowrap; cursor: pointer; transition: all 0.2s;
    }

    .btn-dia.ativo {
      background-color: var(--verde-alvorada); color: white; border-color: var(--verde-alvorada);
      box-shadow: 0 2px 6px rgba(0,122,51,0.3);
    }

    .setor-card {
      background: white; border-radius: 12px; margin-bottom: 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08); overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    .setor-header {
      background-color: #1e293b; color: white;
      padding: 12px 15px; font-weight: bold; font-size: 14px; text-transform: uppercase;
      letter-spacing: 0.5px; display: flex; align-items: center; justify-content: space-between;
    }

    .item-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 15px; border-bottom: 1px solid #eee; gap: 10px; flex-wrap: wrap;
    }

    .item-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 200px; }
    .item-qtd { font-weight: bold; color: var(--verde-escuro); min-width: 65px; font-size: 15px; }
    .item-nome { font-size: 15px; text-transform: uppercase; }

    .checkbox-custom { width: 26px; height: 26px; cursor: pointer; accent-color: var(--verde-alvorada); }

    .box-acao-rapida {
      display: flex; gap: 6px; align-items: center; background: #f8fafc;
      padding: 6px 10px; border-radius: 8px; border: 1px solid #cbd5e1;
    }

    .input-qtd-acao {
      width: 75px; padding: 6px; border: 1px solid #94a3b8; border-radius: 6px;
      text-align: center; font-weight: bold; font-size: 14px;
    }

    .btn-acao {
      background-color: var(--verde-alvorada); color: white; border: none;
      padding: 8px 12px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer;
    }

    .btn-concluir-dia {
      width: 100%; margin-top: 10px; padding: 14px;
      background-color: var(--laranja-alvorada); color: white; border: none;
      border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer;
      text-transform: uppercase; box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }

    .modal-obs {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 2000; padding: 15px;
    }
    .modal-obs-box { background: white; padding: 20px; border-radius: 10px; width: 100%; max-width: 400px; }
    .modal-obs-box textarea { width: 100%; height: 80px; margin: 10px 0; padding: 10px; border-radius: 6px; border: 1px solid #ccc; }
  </style>
</head>
<body>

  <div class="modal-overlay" id="liderModal">
    <div class="modal-box">
      <h2>👋 Bem-vindo!</h2>
      <p>Selecione seu nome para continuar:</p>
      <select id="selectLider">
        <option value="">Selecione...</option>
        <option value="Breno">Breno</option>
        <option value="Raynara">Raynara</option>
        <option value="Elisângela">Elisângela</option>
        <option value="Jonathan">Jonathan</option>
        <option value="Ana Cláudia">Ana Cláudia</option>
        <option value="Jéssica">Jéssica</option>
      </select>
      <button onclick="confirmarLider()">Entrar no Sistema</button>
    </div>
  </div>

  <div id="conteudoPrincipal" style="display: none;">
    <div class="brand-header">
      <div class="brand-title">PANIFICAÇÃO</div>
      <a href="admin.html" style="color: white; text-decoration: none; font-size: 12px; opacity: 0.8;">⚙️ Admin</a>
    </div>

    <div class="lider-bar">
      <span>Líder Ativo: <strong id="nomeLiderExibicao" style="color: var(--verde-alvorada);"></strong></span>
      <button onclick="trocarLider()" style="background: #6c757d; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">Sair</button>
    </div>

    <div class="data-semana-box">
      <span>📅 Segunda-feira da Semana:</span>
      <input type="date" id="inputDataInicio" onchange="atualizarDataInicio(this.value)">
    </div>

    <div class="dias-bar" id="barDias"></div>
    <div id="containerDias"></div>
    <div id="containerBotaoFinalizar"></div>
  </div>

  <div class="modal-obs" id="modalObs">
    <div class="modal-obs-box">
      <h3 style="margin-top:0; color: #c62828;">⚠️ Produtos Não Concluídos</h3>
      <p style="font-size: 13px; color: #666;">Informe o motivo pelos quais os itens restantes não foram produzidos:</p>
      <textarea id="textoObs" placeholder="Ex: Faltou matéria-prima, equipamento em manutenção..."></textarea>
      <button onclick="salvarPendencias()" style="width: 100%; padding: 10px; background: #c62828; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Enviar Justificativa</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-KGrSWvIAKW6ZT0SDGUH7LFLzvYsmcJk",
      authDomain: "panificacao-alvorada.firebaseapp.com",
      databaseURL: "https://panificacao-alvorada-default-rtdb.firebaseio.com",
      projectId: "panificacao-alvorada",
      storageBucket: "panificacao-alvorada.firebasestorage.app",
      messagingSenderId: "537626588403",
      appId: "1:537626588403:web:8bd808f903fe33b422f386"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let liderAtual = localStorage.getItem('liderAtivo') || '';
    let dataInicioSemana = localStorage.getItem('dataInicioSemana') || obterSegundaFeiraAtual();
    let produtosGlobais = [];
    let diaEmFinalizacao = '';

    const diasSemana = ["Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado", "Domingo"];
    let diaSelecionado = diasSemana[0];

    if (liderAtual) {
      iniciarSistema();
    }

    function obterSegundaFeiraAtual() {
      const d = new Date();
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const segunda = new Date(d.setDate(diff));
      return segunda.toISOString().split('T')[0];
    }

    window.atualizarDataInicio = function(val) {
      if (!val) return;
      dataInicioSemana = val;
      localStorage.setItem('dataInicioSemana', dataInicioSemana);
      renderizarBotoesDias();
      renderizarProdutosDoDia();
    };

    function calcularDataDoDia(indexDia) {
      if (!dataInicioSemana) return '';
      const partes = dataInicioSemana.split('-');
      const data = new Date(partes[0], partes[1] - 1, partes[2]);
      data.setDate(data.getDate() + indexDia);
      
      const diaNum = String(data.getDate()).padStart(2, '0');
      const mesNum = String(data.getMonth() + 1).padStart(2, '0');
      return `${diaNum}/${mesNum}`;
    }

    window.confirmarLider = function() {
      const sel = document.getElementById('selectLider').value;
      if (!sel) return alert("Por favor, escolha seu nome!");
      liderAtual = sel;
      localStorage.setItem('liderAtivo', liderAtual);
      iniciarSistema();
    };

    window.trocarLider = function() {
      localStorage.removeItem('liderAtivo');
      location.reload();
    };

    function iniciarSistema() {
      document.getElementById('liderModal').style.display = 'none';
      document.getElementById('conteudoPrincipal').style.display = 'block';
      document.getElementById('nomeLiderExibicao').textContent = liderAtual;
      document.getElementById('inputDataInicio').value = dataInicioSemana;
      renderizarBotoesDias();
      ouvirProdutos();
    }

    function renderizarBotoesDias() {
      const bar = document.getElementById('barDias');
      bar.innerHTML = '';
      diasSemana.forEach((dia, index) => {
        const dataFormatada = calcularDataDoDia(index);
        const btn = document.createElement('button');
        btn.className = `btn-dia ${dia === diaSelecionado ? 'ativo' : ''}`;
        btn.textContent = `${dia.split('-')[0]} (${dataFormatada})`;
        btn.onclick = () => {
          diaSelecionado = dia;
          renderizarBotoesDias();
          renderizarProdutosDoDia();
        };
        bar.appendChild(btn);
      });
    }

    function ouvirProdutos() {
      const produtosRef = ref(db, 'produtos');
      onValue(produtosRef, (snapshot) => {
        const data = snapshot.val();
        produtosGlobais = [];

        if (data) {
          Object.keys(data).forEach(id => {
            produtosGlobais.push({ id, ...data[id] });
          });
        }

        renderizarProdutosDoDia();
      });
    }

    function normalizarString(str) {
      return (str || '').toString().toLowerCase().trim();
    }

    function renderizarProdutosDoDia() {
      const container = document.getElementById('containerDias');
      const containerBtn = document.getElementById('containerBotaoFinalizar');
      container.innerHTML = '';
      containerBtn.innerHTML = '';

      const idxDia = diasSemana.indexOf(diaSelecionado);
      const dataFormatada = calcularDataDoDia(idxDia);

      const prodsDia = produtosGlobais.filter(p => 
        normalizarString(p.lider) === normalizarString(liderAtual) && 
        normalizarString(p.dia) === normalizarString(diaSelecionado)
      );

      if (prodsDia.length > 0) {
        const setores = [...new Set(prodsDia.map(p => p.setor || 'Geral'))];

        setores.forEach(setor => {
          const prodsSetor = prodsDia.filter(p => (p.setor || 'Geral') === setor);

          const setorCard = document.createElement('div');
          setorCard.className = 'setor-card';

          let htmlItens = prodsSetor.map(prod => {
            const isElisangela = normalizarString(liderAtual) === 'elisângela';
            const isJessica = normalizarString(liderAtual) === 'jéssica';

            let acaoVisual = `
              <input type="checkbox" class="checkbox-custom" ${prod.concluido ? 'checked' : ''} onchange="toggleItem('${prod.id}', this.checked)">
            `;

            // 1. ELISÂNGELA: Digita quanto produziu para enviar para a Jéssica
            if (isElisangela && !prod.concluido) {
              acaoVisual = `
                <div class="box-acao-rapida">
                  <input type="number" id="inputQtdElis_${prod.id}" class="input-qtd-acao" placeholder="Fiz Qtd" max="${prod.qtd}">
                  <button class="btn-acao" onclick="enviarParaEmbalagem('${prod.id}')">Enviar Emb.</button>
                </div>
              `;
            }

            // 2. JÉSSICA: Digita o valor real embalado (dá baixa e rebate na Elisângela)
            if (isJessica && !prod.concluido) {
              acaoVisual = `
                <div class="box-acao-rapida">
                  <input type="number" id="inputQtdJess_${prod.id}" class="input-qtd-acao" placeholder="Qtd Real" max="${prod.qtd}">
                  <button class="btn-acao" onclick="darBaixaEmbalagem('${prod.id}')">Dar Baixa</button>
                </div>
              `;
            }

            return `
              <div class="item-row">
                <div class="item-info">
                  ${acaoVisual}
                  <span class="item-qtd">${prod.qtd} ${prod.unidade}</span>
                  <span class="item-nome" style="${prod.concluido ? 'text-decoration: line-through; color: #888;' : ''}">${prod.nome}</span>
                </div>
              </div>
            `;
          }).join('');

          setorCard.innerHTML = `
            <div class="setor-header">
              <span>📍 SETOR: ${setor.toUpperCase()}</span>
              <span style="font-size: 11px; opacity: 0.8;">${prodsSetor.length} item(ns)</span>
            </div>
            ${htmlItens}
          `;

          container.appendChild(setorCard);
        });

        containerBtn.innerHTML = `
          <button class="btn-concluir-dia" onclick="abrirModalConcluir('${diaSelecionado}')">🔒 Finalizar Programação de ${diaSelecionado} (${dataFormatada})</button>
        `;

      } else {
        container.innerHTML = `<div style="text-align:center; padding:35px 15px; color:#777; background:white; border-radius:10px; margin-top:10px;">
          Nenhum produto agendado para <strong>${diaSelecionado} (${dataFormatada})</strong>.
        </div>`;
      }
    }

    window.toggleItem = function(id, concluido) {
      const itemRef = ref(db, `produtos/${id}`);
      update(itemRef, { concluido: concluido });
    };

    // 1. ELISÂNGELA INFORMA O QUANTO PRODUZIU -> CRIA A TAREFA AUTOMÁTICA PARA A JÉSSICA
    window.enviarParaEmbalagem = function(id) {
      const input = document.getElementById(`inputQtdElis_${id}`);
      const qtdProduzida = parseFloat(input.value);
      const prodElis = produtosGlobais.find(p => p.id === id);

      if (!prodElis || isNaN(qtdProduzida) || qtdProduzida <= 0) {
        alert("Por favor, digite a quantidade que você produziu!");
        return;
      }

      if (qtdProduzida > parseFloat(prodElis.qtd)) {
        alert(`A quantidade enviada (${qtdProduzida}) é maior do que a pendente (${prodElis.qtd})!`);
        return;
      }

      const nomeProdJessica = prodElis.nome.toUpperCase().includes('EMB') ? prodElis.nome : `${prodElis.nome} EMB`;

      // Cria a tarefa no painel da Jéssica
      const novoItemJessica = {
        dia: prodElis.dia,
        lider: "Jéssica",
        setor: `${prodElis.setor || 'Bolos'} EMB`,
        qtd: qtdProduzida,
        unidade: prodElis.unidade,
        nome: nomeProdJessica,
        concluido: false,
        finalizadoSemFazer: false,
        idOrigemElisangela: prodElis.id // Vínculo direto
      };

      push(ref(db, 'produtos'), novoItemJessica).then(() => {
        input.value = '';
        alert(`Lote de ${qtdProduzida} ${prodElis.unidade} enviado com sucesso para a Jéssica Embalar!`);
      });
    };

    // 2. JÉSSICA DA BAIXA NO EMBALADO -> REBATE NO TOTAL DA ELISÂNGELA
    window.darBaixaEmbalagem = function(id) {
      const input = document.getElementById(`inputQtdJess_${id}`);
      const qtdEmbalada = parseFloat(input.value);
      const prodJessica = produtosGlobais.find(p => p.id === id);

      if (!prodJessica || isNaN(qtdEmbalada) || qtdEmbalada <= 0) {
        alert("Digite a quantidade exata embalada!");
        return;
      }

      const qtdPendenteJessica = parseFloat(prodJessica.qtd) || 0;
      if (qtdEmbalada > qtdPendenteJessica) {
        alert(`A quantidade digitada (${qtdEmbalada}) não pode ser maior do que a pendente (${qtdPendenteJessica})!`);
        return;
      }

      const novaQtdJessica = Math.max(0, qtdPendenteJessica - qtdEmbalada);
      const jessicaConcluido = novaQtdJessica === 0;

      // Finaliza / Atualiza a tarefa da Jéssica
      update(ref(db, `produtos/${id}`), {
        qtd: novaQtdJessica,
        concluido: jessicaConcluido
      }).then(() => {
        // Desconta o valor embalado do saldo total da Elisângela
        rebaterSaldoElisangela(prodJessica, qtdEmbalada);
        alert(`Baixa de ${qtdEmbalada} registrada! O saldo da Elisângela foi atualizado.`);
      });
    };

    function rebaterSaldoElisangela(prodJessica, qtdEmbalada) {
      let prodElis = null;

      // Tenta achar pelo vínculo direto
      if (prodJessica.idOrigemElisangela) {
        prodElis = produtosGlobais.find(p => p.id === prodJessica.idOrigemElisangela);
      }

      // Se não achar, procura pelo nome parecido
      if (!prodElis) {
        const nomeBase = normalizarString(prodJessica.nome).replace(/\bemb\b/g, '').trim();
        prodElis = produtosGlobais.find(p => 
          normalizarString(p.lider) === 'elisângela' &&
          normalizarString(p.nome).includes(nomeBase) &&
          !p.concluido
        );
      }

      if (prodElis) {
        const qtdAtualElis = parseFloat(prodElis.qtd) || 0;
        const novaQtdElis = Math.max(0, qtdAtualElis - qtdEmbalada);
        const elisConcluido = novaQtdElis === 0;

        update(ref(db, `produtos/${prodElis.id}`), {
          qtd: novaQtdElis,
          concluido: elisConcluido
        });
      }
    }

    window.abrirModalConcluir = function(dia) {
      diaEmFinalizacao = dia;
      const prodsDia = produtosGlobais.filter(p => 
        normalizarString(p.lider) === normalizarString(liderAtual) && 
        normalizarString(p.dia) === normalizarString(dia)
      );
      const pendentes = prodsDia.some(p => !p.concluido);

      if (pendentes) {
        document.getElementById('modalObs').style.display = 'flex';
      } else {
        alert(`Dia ${dia} concluído com sucesso! Todos os produtos foram feitos.`);
      }
    };

    window.salvarPendencias = function() {
      const obs = document.getElementById('textoObs').value.trim();
      if (!obs) return alert("Por favor, digite o motivo de não ter feito os produtos restantes!");

      const prodsDia = produtosGlobais.filter(p => 
        normalizarString(p.lider) === normalizarString(liderAtual) && 
        normalizarString(p.dia) === normalizarString(diaEmFinalizacao) && 
        !p.concluido
      );

      const updates = {};
      prodsDia.forEach(prod => {
        updates[`produtos/${prod.id}/finalizadoSemFazer`] = true;
        updates[`produtos/${prod.id}/obs`] = obs;
      });

      update(ref(db), updates).then(() => {
        document.getElementById('modalObs').style.display = 'none';
        document.getElementById('textoObs').value = '';
        alert("Ocorrência salva e enviada para o Admin!");
      });
    };
  </script>
</body>
</html>
