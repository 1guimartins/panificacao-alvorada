<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Panificação Alvorada</title>
  <style>
    :root {
      --verde-alvorada: #007a33;
      --verde-escuro: #005624;
      --bg-fundo: #f4f6f8;
      --cinza-escuro: #1e293b;
    }

    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-fundo); margin: 0; padding: 15px; }

    .header-admin {
      background: linear-gradient(135deg, var(--verde-alvorada), var(--verde-escuro));
      color: white; padding: 15px 20px; border-radius: 12px;
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .card { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.08); margin-bottom: 20px; border: 1px solid #e2e8f0; }
    .card h2 { margin-top: 0; color: var(--cinza-escuro); font-size: 18px; border-bottom: 2px solid var(--verde-alvorada); padding-bottom: 8px; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 15px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; font-weight: bold; color: #475569; }
    .form-group select, .form-group input { padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
    .form-group select:focus, .form-group input:focus { border-color: var(--verde-alvorada); }

    /* TABELA DE PRODUTOS PARA LANÇAMENTO */
    .tabela-produtos { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    .tabela-produtos th { background-color: var(--cinza-escuro); color: white; padding: 10px; text-align: left; }
    .tabela-produtos td { padding: 10px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
    .tabela-produtos tr:hover { background-color: #f8fafc; }

    .chk-prod { width: 20px; height: 20px; cursor: pointer; accent-color: var(--verde-alvorada); }
    .input-qtd-tabela { width: 90px; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; text-align: center; font-weight: bold; }
    .select-un-tabela { padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; }

    .btn-salvar-lote {
      background-color: var(--verde-alvorada); color: white; border: none; padding: 14px 20px;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; width: 100%;
      margin-top: 20px; box-shadow: 0 3px 8px rgba(0,122,51,0.2);
    }
    .btn-salvar-lote:hover { background-color: var(--verde-escuro); }

    .btn-del { background: #e11d48; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    
    .badge-qtd { background-color: #e2e8f0; color: #0f172a; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
  </style>
</head>

    // EXPOR FUNÇÕES PARA O HTML
    window.carregarSetoresDoLider = function() {
      const lider = document.getElementById('selectLider').value;
      const selectSetor = document.getElementById('selectSetor');
      selectSetor.innerHTML = '<option value="">-- Escolha o Setor --</option>';
      document.getElementById('areaProdutosSetor').style.display = 'none';

      if (!lider || !CATALOGO[lider]) return;

      const setores = Object.keys(CATALOGO[lider]);
      setores.forEach(s => {
        selectSetor.innerHTML += `<option value="${s}">${s}</option>`;
      });
    };

    window.carregarListaDeProdutos = function() {
      const lider = document.getElementById('selectLider').value;
      const setor = document.getElementById('selectSetor').value;
      const area = document.getElementById('areaProdutosSetor');
      const tbody = document.getElementById('tbodyListaProdutos');

      tbody.innerHTML = '';

      if (!lider || !setor || !CATALOGO[lider][setor]) {
        area.style.display = 'none';
        return;
      }

      const produtos = CATALOGO[lider][setor];

      produtos.forEach((prod, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="text-align:center;">
            <input type="checkbox" id="chk_${index}" class="chk-prod" onchange="toggleQtdInput(${index})">
          </td>
          <td><strong>${prod}</strong></td>
          <td>
            <input type="number" id="qtd_${index}" class="input-qtd-tabela" placeholder="0" min="0.1" step="any" disabled>
          </td>
          <td>
            <select id="un_${index}" class="select-un-tabela" disabled>
              <option value="un">un</option>
              <option value="kg">kg</option>
              <option value="rec">receita</option>
              <option value="kit">kit</option>
              <option value="cx">cx</option>
            </select>
          </td>
        `;
        tbody.appendChild(tr);
      });

      area.style.display = 'block';
    };

    window.toggleQtdInput = function(index) {
      const chk = document.getElementById(`chk_${index}`);
      const inputQtd = document.getElementById(`qtd_${index}`);
      const selectUn = document.getElementById(`un_${index}`);

      inputQtd.disabled = !chk.checked;
      selectUn.disabled = !chk.checked;

      if (chk.checked) {
        inputQtd.focus();
      } else {
        inputQtd.value = '';
      }
    };

    window.lançarProdutosSelecionados = function() {
      const dia = document.getElementById('selectDia').value;
      const lider = document.getElementById('selectLider').value;
      const setor = document.getElementById('selectSetor').value;
      const produtos = CATALOGO[lider][setor];

      let totalLancados = 0;

      produtos.forEach((prod, index) => {
        const chk = document.getElementById(`chk_${index}`);
        const qtdInput = document.getElementById(`qtd_${index}`);
        const unSelect = document.getElementById(`un_${index}`);

        if (chk.checked && qtdInput.value && parseFloat(qtdInput.value) > 0) {
          const novoAgendamento = {
            dia: dia,
            lider: lider,
            setor: setor,
            nome: prod,
            qtd: parseFloat(qtdInput.value),
            unidade: unSelect.value,
            concluido: false,
            finalizadoSemFazer: false
          };

          push(ref(db, 'produtos'), novoAgendamento);
          totalLancados++;
        }
      });

      if (totalLancados === 0) {
        alert("Selecione pelo menos um produto e digite uma quantidade válida!");
      } else {
        alert(`${totalLancados} produto(s) lançado(s) com sucesso na produção!`);
        carregarListaDeProdutos(); // Recarrega para limpar
      }
    };

    // ESCUTAR BANCO DE DADOS EM TEMPO REAL
    onValue(ref(db, 'produtos'), (snapshot) => {
      const data = snapshot.val();
      const tabela = document.getElementById('tabelaAgendamentos');
      tabela.innerHTML = '';

      if (data) {
        Object.keys(data).forEach(id => {

            <td><strong>${p.lider}</strong></td>
            <td>${p.setor || '-'}</td>
            <td>${p.nome}</td>
            <td><span class="badge-qtd">${p.qtd} ${p.unidade}</span></td>
            <td><button class="btn-del" onclick="deletarItem('${id}')">🗑️ Excluir</button></td>
          `;
          tabela.appendChild(tr);
        });
      }
    });

    window.deletarItem = function(id) {
      if (confirm("Tem certeza que deseja remover esta ordem de produção?")) {
        remove(ref(db, `produtos/${id}`));
      }
    };
  </script>
</body>
</html>
