<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Panificação Alvorada</title>
  <style>
    :root { var(--verde-alvorada): #007a33; var(--verde-escuro): #005624; var(--bg-fundo): #f4f6f8; var(--cinza-escuro): #1e293b; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f8; margin: 0; padding: 15px; }
    .header-admin { background: linear-gradient(135deg, #007a33, #005624); color: white; padding: 15px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.08); margin-bottom: 20px; border: 1px solid #e2e8f0; }
    .card h2 { margin-top: 0; color: #1e293b; font-size: 18px; border-bottom: 2px solid #007a33; padding-bottom: 8px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 15px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; font-weight: bold; color: #475569; }
    .form-group select { padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
    .tabela-produtos { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    .tabela-produtos th { background-color: #1e293b; color: white; padding: 10px; text-align: left; }
    .tabela-produtos td { padding: 10px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
    .chk-prod { width: 20px; height: 20px; cursor: pointer; accent-color: #007a33; }
    .input-qtd-tabela { width: 90px; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; text-align: center; font-weight: bold; }
    .select-un-tabela { padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .btn-salvar-lote { background-color: #007a33; color: white; border: none; padding: 14px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; width: 100%; margin-top: 20px; }
    .btn-del { background: #e11d48; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .badge-qtd { background-color: #e2e8f0; color: #0f172a; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
    .badge-produzido { background-color: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
    .badge-embalado { background-color: #dcfce7; color: #15803d; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
    .barra-progresso-bg { background-color: #e2e8f0; border-radius: 8px; height: 10px; width: 100%; overflow: hidden; margin-top: 4px; }
    .barra-progresso-fill { background-color: #007a33; height: 100%; transition: width 0.3s ease; }
  </style>
</head>
<body>

  <div class="header-admin">
    <h1 style="margin:0; font-size:20px;">⚙️ Painel do Administrador</h1>
    <a href="index.html" style="color:white; text-decoration:none; font-weight:bold; background: rgba(255,255,255,0.2); padding: 8px 14px; border-radius: 6px;">← Ir para Tela Produção</a>
  </div>

  <div class="card">
    <h2>⚡ Lançar Meta Geral de Produção</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>1. Dia da Semana:</label>
        <select id="selectDia">
          <option value="Segunda-feira">Segunda-feira</option>
          <option value="Terça-feira">Terça-feira</option>
          <option value="Quarta-feira">Quarta-feira</option>
          <option value="Quinta-feira">Quinta-feira</option>
          <option value="Sexta-feira">Sexta-feira</option>
          <option value="Sábado">Sábado</option>
          <option value="Domingo">Domingo</option>
        </select>
      </div>

      <div class="form-group">
        <label>2. Líder da Produção:</label>
        <select id="selectLider" onchange="carregarSetoresDoLider()">
          <option value="">Escolha o Líder...</option>
          <option value="Breno">Breno</option>
          <option value="Elisângela">Elisângela</option>
          <option value="Raynara">Raynara</option>
          <option value="Jonathan">Jonathan</option>
        </select>
      </div>

      <div class="form-group">
        <label>3. Setor:</label>
        <select id="selectSetor" onchange="carregarListaDeProdutos()">
          <option value="">Aguardando Líder...</option>
        </select>
      </div>
    </div>

    <div id="areaProdutosSetor" style="display:none; margin-top:20px;">
      <h3 style="font-size:15px; color:#334155; margin-bottom:10px;">📋 Defina as metas dos produtos:</h3>
      <div style="overflow-x:auto;">
        <table class="tabela-produtos">
          <thead>
            <tr>
              <th style="width: 40px; text-align:center;">✓</th>
              <th>Nome do Produto</th>
              <th style="width: 110px;">Meta Total</th>
              <th style="width: 100px;">Medida</th>
            </tr>
          </thead>
          <tbody id="tbodyListaProdutos"></tbody>
        </table>
      </div>
      <button class="btn-salvar-lote" onclick="lançarProdutosSelecionados()">➕ Lançar Ordem de Produção</button>
    </div>
  </div>

  <div class="card">
    <h2>📊 Monitoramento em Tempo Real (Ao Vivo)</h2>
    <div style="overflow-x:auto;">
      <table class="tabela-produtos">
        <thead>
          <tr>
            <th>Dia</th>
            <th>Líder Produção</th>
            <th>Setor</th>
            <th>Produto</th>
            <th>Meta Total</th>
            <th>Feito (Produção)</th>
            <th>Embalado (Jéssica)</th>
            <th>Progresso</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="tabelaAgendamentos"></tbody>
      </table>
    </div>
  </div>

  <script type="module">

    const firebaseConfig = {
      apiKey: "AIzaSyB-KGrSWvIAKW6ZT0SDGUH7LFLzvYsmcJk",

      projectId: "panificacao-alvorada",
      storageBucket: "panificacao-alvorada.firebasestorage.app",
      messagingSenderId: "537626588403",
      appId: "1:537626588403:web:8bd808f903fe33b422f386"

          "Bolo Cremoso de Milho", "Bolo Cremoso de Quebra Queixo", "Bolo Cremoso de Pamonha", "Bolo Cremoso de Red Velvet c/ Cobertura",
          "Bolo Redondo de Cenoura c/ Cobertura", "Bolo Redondo de Chocolate c/ Cobertura", "Bolo Redondo de Churros c/ Cobertura",
          "Bolo Redondo de Coco c/ Cobertura", "Bolo Redondo de Limão c/ Cobertura", "Bolo Redondo de Café c/ Cobertura",
          "Bolo Redondo de Cappuccino c/ Cobertura", "Bolo Redondo de Nozes c/ Cobertura", "Bolo Redondo de Paçoca c/ Cobertura"
        ],

        ],
        "Levain": [

          "Baguete Levain Tradicional UND", "Ciabatta c/ Azeitona KG", "Ciabatta c/ Azeitona UND", "Ciabatta c/ Calabresa UND",
          "Ciabatta c/ Tomate Seco KG", "Ciabatta c/ Tomate Seco UND", "Croissant Tradicional", "Croissant de Frango",
          "Croissant de Presunto e Queijo", "Pão de Grãos Levain UND", "Pão Italiano Levain UND", "Pão Levain Açafrão UND",
          "Pão Levain Braga UND", "Pão Levain Cacau c/ Laranja UND", "Pão Levain Ciabatta c/ 2 UND", "Pão Levain Cupiac UND",
          "Pão Levain Focaccia KG", "Pão Levain Focaccia UND", "Pão Levain Italiano Bola c/ 2 UND", "Pão Levain Italiano KG",
          "Pão Levain Italiano UND", "Pão Levain Mineiroca KG", "Pão Levain Mini Baguete c/ 2 UND", "Pão Levain Nozes c/ Mel KG",
          "Pão Levain Vinho c/ Uva Passas UND", "Pão Levain Campanha UND", "Pão Levain Nozes c/ Mel UND"
        ]
      }
    };

    window.carregarSetoresDoLider = function() {
      const lider = document.getElementById('selectLider').value;
      const selectSetor = document.getElementById('selectSetor');
      selectSetor.innerHTML = '<option value="">-- Escolha o Setor --</option>';
      document.getElementById('areaProdutosSetor').style.display = 'none';

      if (!lider || !CATALOGO[lider]) return;
      Object.keys(CATALOGO[lider]).forEach(s => selectSetor.innerHTML += `<option value="${s}">${s}</option>`);
    };

    window.carregarListaDeProdutos = function() {
      const lider = document.getElementById('selectLider').value;
      const setor = document.getElementById('selectSetor').value;
      const area = document.getElementById('areaProdutosSetor');
      const tbody = document.getElementById('tbodyListaProdutos');

      tbody.innerHTML = '';
      if (!lider || !setor || !CATALOGO[lider][setor]) { area.style.display = 'none'; return; }

      CATALOGO[lider][setor].forEach((prod, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="text-align:center;"><input type="checkbox" id="chk_${index}" class="chk-prod" onchange="toggleQtdInput(${index})"></td>
          <td><strong>${prod}</strong></td>
          <td><input type="number" id="qtd_${index}" class="input-qtd-tabela" placeholder="0" disabled></td>
          <td>
            <select id="un_${index}" class="select-un-tabela" disabled>
              <option value="un">un</option>
              <option value="kg">kg</option>
              <option value="rec">receita</option>
            </select>
          </td>
        `;
        tbody.appendChild(tr);
      });
      area.style.display = 'block';
    };

    window.toggleQtdInput = function(index) {
      const chk = document.getElementById(`chk_${index}`);
      const inputQtd = document.getElementById(`qtd_${index}`);
      const selectUn = document.getElementById(`un_${index}`);

      inputQtd.disabled = !chk.checked;
      selectUn.disabled = !chk.checked;
      if (chk.checked) inputQtd.focus(); else inputQtd.value = '';
    };

    window.lançarProdutosSelecionados = function() {
      const dia = document.getElementById('selectDia').value;
      const lider = document.getElementById('selectLider').value;
      const setor = document.getElementById('selectSetor').value;
      const produtos = CATALOGO[lider][setor];
      let totalLancados = 0;

      produtos.forEach((prod, index) => {
        const chk = document.getElementById(`chk_${index}`);
        const qtdInput = document.getElementById(`qtd_${index}`);
        const unSelect = document.getElementById(`un_${index}`);

        if (chk.checked && qtdInput.value && parseFloat(qtdInput.value) > 0) {
          push(ref(db, 'produtos'), {
            dia: dia,
            lider: lider,
            setor: setor,
            nome: prod,
            qtd: parseFloat(qtdInput.value),
            qtdFeita: 0,
            qtdEmbalada: 0,
            unidade: unSelect.value
          });
          totalLancados++;
        }
      });

      if (totalLancados === 0) alert("Selecione pelo menos um produto com quantidade!");
      else { alert(`${totalLancados} meta(s) lançada(s)!`); carregarListaDeProdutos(); }
    };

    onValue(ref(db, 'produtos'), (snapshot) => {
      const data = snapshot.val();
      const tabela = document.getElementById('tabelaAgendamentos');
      tabela.innerHTML = '';

      if (data) {
        Object.keys(data).forEach(id => {
          const p = data[id];
          const meta = parseFloat(p.qtd) || 0;
          const feito = parseFloat(p.qtdFeita || p.qtdEnviadaEmb || 0);
          const embalado = parseFloat(p.qtdEmbalada || p.qtdRealizada || 0);
          const pct = Math.min(100, Math.round((embalado / meta) * 100));

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${p.dia}</td>
            <td><strong>${p.lider}</strong></td>
            <td>${p.setor || '-'}</td>
            <td>${p.nome || p.produto}</td>
            <td><span class="badge-qtd">${meta} ${p.unidade}</span></td>
            <td><span class="badge-produzido">${feito} ${p.unidade}</span></td>
            <td><span class="badge-embalado">${embalado} ${p.unidade}</span></td>
            <td style="width: 120px;">
              <small><strong>${pct}%</strong></small>
              <div class="barra-progresso-bg"><div class="barra-progresso-fill" style="width: ${pct}%;"></div></div>
            </td>
            <td><button class="btn-del" onclick="deletarItem('${id}')">🗑️ Excluir</button></td>
          `;
          tabela.appendChild(tr);
        });
      }
    });

    window.deletarItem = function(id) {
      if (confirm("Deseja deletar este item?")) remove(ref(db, `produtos/${id}`));
    };
  </script>
</body>
</html>
