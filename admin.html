<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expedição por Loja - Panificação Alvorada</title>
  <style>
    :root { 
      --verde-alvorada: #007a33; 
      --verde-escuro: #005624; 
      --bg-fundo: #f4f6f8; 
      --texto-dark: #1e293b;
    }
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: var(--bg-fundo); margin: 0; padding: 15px; }
    
    .header { 
      background: linear-gradient(135deg, var(--verde-alvorada), var(--verde-escuro)); 
      color: white; padding: 15px 20px; border-radius: 8px; 
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; 
    }
    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: 1px solid #cbd5e1; margin-bottom: 15px; }
    
    /* Navegação de Dias */
    .nav-dias { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .btn-dia { 
      padding: 8px 16px; border: 1px solid #cbd5e1; background: #e2e8f0; 
      border-radius: 20px; font-weight: bold; cursor: pointer; color: #475569; transition: all 0.2s;
    }
    .btn-dia.ativo { background: var(--verde-alvorada); color: white; border-color: var(--verde-escuro); box-shadow: 0 2px 6px rgba(0,122,51,0.3); }

    /* Navegação de Categorias / Planilhas */
    .nav-categorias { display: flex; gap: 6px; margin-bottom: 15px; flex-wrap: wrap; background: #f1f5f9; padding: 8px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .btn-cat { 
      padding: 6px 14px; border: 1px solid #cbd5e1; background: white; 
      border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; color: #334155; transition: all 0.2s;
    }
    .btn-cat.ativo { background: #1e293b; color: white; border-color: #0f172a; }

    /* Painel de Metas */
    .painel-metas { display: none; background: #f8fafc; padding: 12px; border-radius: 6px; border: 1px dashed #94a3b8; margin-bottom: 15px; }
    .grid-metas { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 10px; max-height: 300px; overflow-y: auto; }
    .item-meta-input { display: flex; flex-direction: column; font-size: 11px; font-weight: bold; background: white; padding: 6px; border-radius: 4px; border: 1px solid #e2e8f0; }
    .item-meta-input input { padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; margin-top: 3px; }

    /* Tabela Invertida (Produtos nas Linhas x Lojas nas Colunas) */
    .container-tabela { overflow: auto; max-height: 70vh; border: 1px solid #cbd5e1; border-radius: 6px; }
    table.tabela-expedicao { width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; white-space: nowrap; }
    table.tabela-expedicao th, table.tabela-expedicao td { border: 1px solid #cbd5e1; padding: 4px 6px; }
    table.tabela-expedicao thead th { background-color: #1e293b; color: white; position: sticky; top: 0; z-index: 3; }
    
    /* Colunas Fixas à Esquerda */
    .col-prod-nome { 
      text-align: left; font-weight: bold; min-width: 220px; max-width: 250px; 
      position: sticky; left: 0; background-color: #f8fafc; z-index: 2; 
    }
    .col-progresso { min-width: 110px; position: sticky; left: 220px; background-color: #f8fafc; z-index: 2; }
    .col-tot-dia { font-weight: bold; background-color: #e2e8f0; min-width: 70px; }

    /* Lojas */
    .th-loja { min-width: 48px; font-size: 11px; }
    .th-loja-ref { background-color: #ca8a04 !important; color: white; }
    .td-loja-ref { background-color: #fef08a; }

    .badge-progresso {
      background: #0284c7; color: white; font-size: 10px; font-weight: bold;
      padding: 3px 6px; border-radius: 10px; display: inline-block;
    }
    .badge-progresso.concluido { background: #16a34a; }
    .badge-progresso.pendente { background: #d97706; }
    
    input.qtd-loja {
      width: 42px; text-align: center; padding: 4px; border: 1px solid #94a3b8; border-radius: 4px; font-weight: bold;
    }
    input.qtd-loja:focus { background-color: #e0f2fe; border-color: #0284c7; outline: none; }
    
    .btn-acao { background-color: var(--verde-alvorada); color: white; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-acao:hover { background-color: var(--verde-escuro); }
    .btn-secundario { background-color: #64748b; color: white; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
  </style>
</head>

    // Inicializa a Tabela para a Categoria Selecionada
    function inicializarTabela() {
      const trCab = document.getElementById('trCabecalhoLojas');
      const tbody = document.getElementById('tbodyProdutos');
      const containerMetas = document.getElementById('containerInputsMetas');

      trCab.innerHTML = `

        <th class="col-progresso">ACUMULADO / META</th>
        <th class="col-tot-dia">TOTAL DIA</th>
      `;
      tbody.innerHTML = '';
      containerMetas.innerHTML = '';

      // Adiciona Colunas de LOJA 01 até LOJA 21
      for (let i = 1; i <= 21; i++) {
        const numLoja = String(i).padStart(2, '0');
        const th = document.createElement('th');
        th.className = `th-loja ${i === 5 ? 'th-loja-ref' : ''}`;
        th.innerText = i === 5 ? 'L05 (Ref.)' : `LJ ${numLoja}`;
        trCab.appendChild(th);
      }

      // Adiciona Linhas dos Produtos da Categoria Ativa
      const prods = CATEGORIAS_DADOS[categoriaAtual].produtos;

      prods.forEach((prodObj, pIdx) => {
        const tr = document.createElement('tr');
        
        let html = `
          <td class="col-prod-nome" title="Cód: ${prodObj.item}">${prodObj.nome}</td>

          <td class="col-tot-dia" id="total_dia_p${pIdx}">0</td>
        `;

        // Inputs das Lojas
        for (let i = 1; i <= 21; i++) {
          const numLoja = String(i).padStart(2, '0');
          html += `
            <td class="${i === 5 ? 'td-loja-ref' : ''}">
              <input type="number" class="qtd-loja" id="input_P${pIdx}_L${numLoja}" 
                placeholder="0" oninput="window.calcularTotais()" min="0">
            </td>
          `;
        }

        tr.innerHTML = html;
        tbody.appendChild(tr);

        // Input para Cadastro da Meta
        containerMetas.innerHTML += `
          <div class="item-meta-input">
            <label>[${prodObj.item}] ${prodObj.nome}</label>
            <input type="number" id="meta_input_p${pIdx}" placeholder="Meta Semanal">
          </div>
        `;
      });
    }

    // Troca de Categoria
    window.mudarCategoria = function(catKey, btnElement) {
      categoriaAtual = catKey;
      document.getElementById('labelCategoriaAtiva').innerText = `| Categoria: ${CATEGORIAS_DADOS[catKey].nome}`;
      document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('ativo'));
      btnElement.classList.add('ativo');
      inicializarTabela();
      carregarDadosSemana();
    };

    // Troca de Dia da Semana
    window.mudarDia = function(dia, btnElement) {
      diaAtual = dia;
      document.getElementById('labelDiaSelecionado').innerText = `Lançamento: ${dia}`;
      document.querySelectorAll('.btn-dia').forEach(b => b.classList.remove('ativo'));
      btnElement.classList.add('ativo');
      carregarDadosSemana();
    };

    window.togglePainelMetas = function() {
      const p = document.getElementById('painelMetasSemana');
      p.style.display = p.style.display === 'block' ? 'none' : 'block';
    };

    // Salva Metas no Firebase
    window.salvarMetasSemana = function() {
      const prods = CATEGORIAS_DADOS[categoriaAtual].produtos;
      const pacoteMetas = {};

      prods.forEach((_, pIdx) => {
        const val = parseInt(document.getElementById(`meta_input_p${pIdx}`).value) || 0;
        pacoteMetas[pIdx] = val;
      });

      set(ref(db, `expedicao_metas_semana/${categoriaAtual}`), pacoteMetas)
        .then(() => {
          alert('Metas salvas com sucesso!');
          document.getElementById('painelMetasSemana').style.display = 'none';
          carregarDadosSemana();
        })
        .catch(err => alert("Erro ao salvar metas: " + err.message));
    };

    // Salva Lançamentos Diários
    window.salvarExpedicaoDia = function() {
      const prods = CATEGORIAS_DADOS[categoriaAtual].produtos;
      const pacoteSalvar = {};
      
      prods.forEach((_, pIdx) => {
        pacoteSalvar[`PROD_${pIdx}`] = {};
        for (let i = 1; i <= 21; i++) {
          const numLoja = String(i).padStart(2, '0');
          const input = document.getElementById(`input_P${pIdx}_L${numLoja}`);
          pacoteSalvar[`PROD_${pIdx}`][`LOJA_${numLoja}`] = parseInt(input.value) || 0;
        }
      });

      set(ref(db, `expedicao_lojas/${categoriaAtual}/${diaAtual}`), pacoteSalvar)
        .then(() => alert(`Lançamentos de ${diaAtual} salvos para ${CATEGORIAS_DADOS[categoriaAtual].nome}!`))
        .catch(err => alert("Erro ao salvar: " + err.message));
    };

    // Cálculos em Tempo Real (Total do Dia e Acumulado x Meta)
    window.calcularTotais = function() {
      const prods = CATEGORIAS_DADOS[categoriaAtual].produtos;
      const somaHoje = {};

      prods.forEach((_, pIdx) => {
        let totalDia = 0;
        for (let i = 1; i <= 21; i++) {
          const numLoja = String(i).padStart(2, '0');
          const input = document.getElementById(`input_P${pIdx}_L${numLoja}`);
          if (input && input.value) {
            totalDia += parseInt(input.value) || 0;
          }
        }
        somaHoje[pIdx] = totalDia;
        document.getElementById(`total_dia_p${pIdx}`).innerText = totalDia;
      });

      // Soma acumulada da semana toda
      prods.forEach((_, pIdx) => {
        let acumuladoSemana = 0;
        const dias = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];

        dias.forEach(d => {
          if (d === diaAtual) {
            acumuladoSemana += somaHoje[pIdx] || 0;
          } else if (todosLancamentosSemana[d] && todosLancamentosSemana[d][`PROD_${pIdx}`]) {
            for (let i = 1; i <= 21; i++) {
              const numLoja = String(i).padStart(2, '0');
              acumuladoSemana += todosLancamentosSemana[d][`PROD_${pIdx}`][`LOJA_${numLoja}`] || 0;
            }
          }
        });

        const metaTotal = metasSemanais[pIdx] || 0;
        const badge = document.getElementById(`badge_p${pIdx}`);
        
        badge.innerText = `${acumuladoSemana} / ${metaTotal}`;

        if (metaTotal > 0 && acumuladoSemana >= metaTotal) {
          badge.className = 'badge-progresso concluido';
        } else if (acumuladoSemana > 0) {
          badge.className = 'badge-progresso pendente';
        } else {
          badge.className = 'badge-progresso';
        }
      });
    };

    // Carregar Dados do Firebase
    function carregarDadosSemana() {
      onValue(ref(db, `expedicao_metas_semana/${categoriaAtual}`), (snapshot) => {
        metasSemanais = snapshot.val() || {};
        const prods = CATEGORIAS_DADOS[categoriaAtual].produtos;

        prods.forEach((_, pIdx) => {
          const inp = document.getElementById(`meta_input_p${pIdx}`);
          if (inp) inp.value = metasSemanais[pIdx] || '';
        });

        onValue(ref(db, `expedicao_lojas/${categoriaAtual}`), (snapLojas) => {
          todosLancamentosSemana = snapLojas.val() || {};
          const dadosDia = todosLancamentosSemana[diaAtual] || {};

          prods.forEach((_, pIdx) => {
            const prodKey = `PROD_${pIdx}`;
            for (let i = 1; i <= 21; i++) {
              const numLoja = String(i).padStart(2, '0');
              const input = document.getElementById(`input_P${pIdx}_L${numLoja}`);
              if (input) {
                const val = (dadosDia[prodKey] && dadosDia[prodKey][`LOJA_${numLoja}`]) ? dadosDia[prodKey][`LOJA_${numLoja}`] : '';
                input.value = val > 0 ? val : '';
              }
            }
          });
          window.calcularTotais();
        }, { onlyOnce: true });

      }, { onlyOnce: true });
    }

    renderizarAbasCategorias();
    inicializarTabela();
    carregarDadosSemana();
  </script>
</body>
</html>
