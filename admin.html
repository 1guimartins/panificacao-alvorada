<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expedição por Loja - Panificação Alvorada</title>
  <style>
    :root { --verde-alvorada: #007a33; --verde-escuro: #005624; --bg-fundo: #f4f6f8; }
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background-color: var(--bg-fundo); margin: 0; padding: 15px; }
    
    .header { background: linear-gradient(135deg, #007a33, #005624); color: white; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border: 1px solid #ccc; margin-bottom: 20px; }
    
    .controles { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; }
    .controles select { padding: 8px 12px; border-radius: 6px; border: 1px solid #888; font-size: 14px; font-weight: bold; }

    /* Estilo da Tabela Idêntica à Folha Física */
    .container-tabela { overflow-x: auto; max-height: 75vh; }
    table.tabela-expedicao { width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; }
    table.tabela-expedicao th, table.tabela-expedicao td { border: 1px solid #444; padding: 4px; }
    
    /* Cabeçalho na vertical como na folha */
    table.tabela-expedicao th.col-prod { 
      height: 160px; 
      white-space: nowrap; 
      vertical-align: bottom;
      padding-bottom: 10px;
      background-color: #e2e8f0;
    }
    table.tabela-expedicao th.col-prod div {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-weight: bold;
      font-size: 12px;
    }
    
    .col-loja { width: 80px; font-weight: bold; background-color: #f1f5f9; position: sticky; left: 0; z-index: 2; }
    .linha-reforma { background-color: #fef08a !important; color: #854d0e; }
    .linha-total { background-color: #cbd5e1; font-weight: bold; font-size: 12px; }
    
    input.qtd-loja {
      width: 45px;
      text-align: center;
      padding: 3px;
      border: 1px solid #999;
      border-radius: 4px;
      font-weight: bold;
    }
    input.qtd-loja:focus { background-color: #e0f2fe; border-color: #0284c7; }
    
    .btn-salvar { background-color: var(--verde-alvorada); color: white; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-salvar:hover { background-color: var(--verde-escuro); }
  </style>
</head>
<body>

  <div class="header">
    <h2 style="margin:0;">📦 Ficha de Expedição e Lançamento por Loja</h2>
    <a href="admin.html" style="color:white; text-decoration:none; background:rgba(255,255,255,0.2); padding:6px 12px; border-radius:4px; font-size:13px;">⚙️ Ir para Painel Admin</a>
  </div>

  <div class="card">
    <div class="controles">
      <label><strong>Dia do Lançamento:</strong></label>
      <select id="selectDiaSemana" onchange="carregarDadosExpedicao()">
        <option value="Segunda-feira">Segunda-feira</option>
        <option value="Terça-feira">Terça-feira</option>
        <option value="Quarta-feira">Quarta-feira</option>
        <option value="Quinta-feira">Quinta-feira</option>
        <option value="Sexta-feira">Sexta-feira</option>
        <option value="Sábado">Sábado</option>
      </select>

      <button class="btn-salvar" onclick="salvarExpedicaoDia()">💾 Salvar Lançamentos do Dia</button>
    </div>

    <div class="container-tabela">
      <table class="tabela-expedicao">
        <thead>
          <tr id="trCabecalhoProdutos">
            <th class="col-loja">LOJA / ITEM</th>
            </tr>
        </thead>
        <tbody id="tbodyLojas">
          </tbody>
        <tfoot>
          <tr class="linha-total" id="trTotalDia">
            <td class="col-loja">TOTAL DIA</td>
            </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-KGrSWvIAKW6ZT0SDGUH7LFLzvYsmcJk",
      authDomain: "panificacao-alvorada.firebaseapp.com",
      databaseURL: "https://panificacao-alvorada-default-rtdb.firebaseio.com",
      projectId: "panificacao-alvorada",
      storageBucket: "panificacao-alvorada.firebasestorage.app",
      messagingSenderId: "537626588403",
      appId: "1:537626588403:web:8bd808f903fe33b422f386"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Produtos idênticos aos da folha enviada
    const LISTA_PRODUTOS = [
      "BRIOCHE C/ COCO", "BRIOCHE TRADICIONAL", "PÃO DE BATATA", "PÃO DE CEBOLA",
      "PÃO DE FORMA 52% INTEGRAL", "PÃO DE FORMA P/ TORTA", "PÃO DE FORMA TRADICIONAL",
      "PÃO DE HAMBURGUER C/ GERGELIM", "PÃO DE HAMBURGUER TRADICIONAL", "PÃO DE HOT DOG",
      "PÃO DE MILHO TRADICIONAL", "PÃO SOVADO", "PAULISTINHA", "ROSCA DA FAZENDA C/ AÇÚCAR",
      "ROSCA DA FAZENDA TRADICIONAL", "ROSCA DE LEITE CONDENSADO", "ROSCA LISA",
      "ROSCA RAINHA", "ROSCA RAINHA C/ CREME", "ROSQUINHA C/ AÇÚCAR", "ROSQUINHA C/ CREME"
    ];

    let dadosDiaAtual = {};

    // 1. Monta o Cabeçalho da Tabela
    function renderizarTabela() {
      const trCab = document.getElementById('trCabecalhoProdutos');
      const trTot = document.getElementById('trTotalDia');
      const tbody = document.getElementById('tbodyLojas');

      LISTA_PRODUTOS.forEach((prod, pIdx) => {
        // Coluna Produto (Rotacionada)
        const th = document.createElement('th');
        th.className = 'col-prod';
        th.innerHTML = `<div>${prod}</div>`;
        trCab.appendChild(th);

        // Coluna Rodapé Total
        const tdTot = document.createElement('td');
        tdTot.id = `total_prod_${pIdx}`;
        tdTot.innerText = '0';
        trTot.appendChild(tdTot);
      });

      // Renderiza as 21 Lojas
      for (let i = 1; i <= 21; i++) {
        const numLoja = String(i).padStart(2, '0');
        const tr = document.createElement('tr');
        
        if (i === 5) tr.className = 'linha-reforma'; // Destaque para Loja 05 (Reforma)

        let html = `<td class="col-loja">LOJA ${numLoja} ${i === 5 ? '(Ref.)' : ''}</td>`;

        LISTA_PRODUTOS.forEach((_, pIdx) => {
          html += `
            <td>
              <input type="number" class="qtd-loja" id="input_L${numLoja}_P${pIdx}" 
                placeholder="0" oninput="window.calcularTotaisColunas()" min="0">
            </td>
          `;
        });

        tr.innerHTML = html;
        tbody.appendChild(tr);
      }
    }

    // 2. Calcula Totais por Coluna em tempo real
    window.calcularTotaisColunas = function() {
      LISTA_PRODUTOS.forEach((_, pIdx) => {
        let soma = 0;
        for (let i = 1; i <= 21; i++) {
          const numLoja = String(i).padStart(2, '0');
          const input = document.getElementById(`input_L${numLoja}_P${pIdx}`);
          if (input && input.value) {
            soma += parseInt(input.value) || 0;
          }
        }
        document.getElementById(`total_prod_${pIdx}`).innerText = soma;
      });
    };

    // 3. Salva Lançamentos do Dia Selecionado no Firebase
    window.salvarExpedicaoDia = function() {
      const dia = document.getElementById('selectDiaSemana').value;
      const pacoteSalvar = {};

      for (let i = 1; i <= 21; i++) {
        const numLoja = String(i).padStart(2, '0');
        pacoteSalvar[`LOJA_${numLoja}`] = {};

        LISTA_PRODUTOS.forEach((prod, pIdx) => {
          const input = document.getElementById(`input_L${numLoja}_P${pIdx}`);
          pacoteSalvar[`LOJA_${numLoja}`][pIdx] = parseInt(input.value) || 0;
        });
      }

      set(ref(db, `expedicao_lojas/${dia}`), pacoteSalvar)
        .then(() => alert(`Lançamentos de ${dia} salvos com sucesso!`))
        .catch((err) => alert("Erro ao salvar: " + err.message));
    };

    // 4. Carrega os Dados do Dia do Banco de Dados
    window.carregarDadosExpedicao = function() {
      const dia = document.getElementById('selectDiaSemana').value;

      // Limpa inputs
      document.querySelectorAll('.qtd-loja').forEach(inp => inp.value = '');

      onValue(ref(db, `expedicao_lojas/${dia}`), (snapshot) => {
        const data = snapshot.val() || {};
        
        for (let i = 1; i <= 21; i++) {
          const numLoja = String(i).padStart(2, '0');
          const lojaKey = `LOJA_${numLoja}`;

          if (data[lojaKey]) {
            LISTA_PRODUTOS.forEach((_, pIdx) => {
              const input = document.getElementById(`input_L${numLoja}_P${pIdx}`);
              if (input && data[lojaKey][pIdx] !== undefined) {
                input.value = data[lojaKey][pIdx] > 0 ? data[lojaKey][pIdx] : '';
              }
            });
          }
        }
        window.calcularTotaisColunas();
      }, { onlyOnce: true });
    };

    // Inicialização
    renderizarTabela();
    window.carregarDadosExpedicao();
  </script>
</body>
</html>
