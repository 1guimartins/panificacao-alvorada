<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panificação Alvorada - Planejamento</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #dce3eb; padding: 0; }

    /* Cabeçalho Verde (Igual ao seu sistema) */
    .top-bar {
      background-color: #0d6232;
      color: white;
      padding: 12px 20px;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Navegação por Abas */
    .nav-tabs {
      background-color: #dce3eb;
      padding: 10px 20px 0 20px;
      display: flex;
      gap: 10px;
    }

    .tab-btn {
      background: white;
      border: 1px solid #ccc;
      padding: 8px 16px;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      color: #333;
      text-decoration: none;
    }

    .tab-btn.active {
      background: #0d6232;
      color: white;
      border-color: #0d6232;
    }

    /* Conteúdo Principal */
    .container { padding: 20px; }

    .planner-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .day-column {
      background: #ffffff;
      border-radius: 6px;
      border: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      min-height: 500px;
    }

    .day-header {
      background-color: #1e293b;
      color: white;
      padding: 10px;
      text-align: center;
    }

    .day-name { font-weight: bold; text-transform: uppercase; font-size: 0.95rem; }
    .day-date { font-size: 0.85rem; color: #cbd5e1; outline: none; margin-top: 3px; }

    .day-content {
      padding: 12px;
      flex-grow: 1;
      outline: none;
      line-height: 1.5;
      font-size: 0.9rem;
      color: #333;
    }

    .day-content:focus, .day-date:focus { background-color: #f1f5f9; }

    /* Modal de Login */
    .login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
    }

    .login-card {
      background: white; padding: 30px; border-radius: 8px;
      width: 320px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .login-card h2 { margin-bottom: 15px; color: #0d6232; font-size: 1.3rem; }
    .login-card input {
      width: 100%; padding: 10px; margin-bottom: 12px;
      border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem;
    }

    .login-card button {
      width: 100%; padding: 10px; background: #0d6232;
      color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;
    }

    .login-card button:hover { background: #094723; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="loginModal" class="login-overlay">
    <div class="login-card">
      <h2>Acesso ao Planejamento</h2>
      <input type="text" id="userInput" placeholder="Usuário (Ex: admin)">
      <input type="password" id="passInput" placeholder="Senha (Ex: 1234)">
      <button onclick="fazerLogin()">Entrar</button>
    </div>
  </div>

  <div class="top-bar">
    🥐 Panificação Alvorada - Gestão Integrada
  </div>

  <div class="nav-tabs">
    <a href="admin.html" class="tab-btn">⚙️ Painel Admin / ERP</a>
    <a href="planejamento.html" class="tab-btn active">📅 Planejamento Semanal</a>
  </div>

  <div class="container">
    <div class="planner-grid">
      <div class="day-column">
        <div class="day-header">
          <div class="day-name">Segunda-feira</div>
          <div class="day-date" contenteditable="true" id="date-0">--/--/----</div>
        </div>
        <div class="day-content" contenteditable="true" id="content-0" oninput="salvarDados()"></div>
      </div>

      <div class="day-column">
        <div class="day-header">
          <div class="day-name">Terça-feira</div>
          <div class="day-date" contenteditable="true" id="date-1">--/--/----</div>
        </div>
        <div class="day-content" contenteditable="true" id="content-1" oninput="salvarDados()"></div>
      </div>

      <div class="day-column">
        <div class="day-header">
          <div class="day-name">Quarta-feira</div>
          <div class="day-date" contenteditable="true" id="date-2">--/--/----</div>
        </div>
        <div class="day-content" contenteditable="true" id="content-2" oninput="salvarDados()"></div>
      </div>

      <div class="day-column">
        <div class="day-header">
          <div class="day-name">Quinta-feira</div>
          <div class="day-date" contenteditable="true" id="date-3">--/--/----</div>
        </div>
        <div class="day-content" contenteditable="true" id="content-3" oninput="salvarDados()"></div>
      </div>

      <div class="day-column">
        <div class="day-header">
          <div class="day-name">Sexta-feira</div>
          <div class="day-date" contenteditable="true" id="date-4">--/--/----</div>
        </div>
        <div class="day-content" contenteditable="true" id="content-4" oninput="salvarDados()"></div>
      </div>
    </div>
  </div>

  <script>
    // Configuração de Login simples (você pode alterar o usuário e senha aqui)
    function fazerLogin() {
      const user = document.getElementById('userInput').value;
      const pass = document.getElementById('passInput').value;

      if (user === 'admin' && pass === '1234') {
        document.getElementById('loginModal').classList.add('hidden');
        sessionStorage.setItem('logado', 'true');
      } else {
        alert('Usuário ou senha incorretos!');
      }
    }

    // Mantém o usuário logado durante a sessão
    if (sessionStorage.getItem('logado') === 'true') {
      document.getElementById('loginModal').classList.add('hidden');
    }

    // Preenche as datas da semana atual
    function preencherDatas() {
      const hoje = new Date();
      const diaSemana = hoje.getDay();
      const distSegunda = diaSemana === 0 ? -6 : 1 - diaSemana;
      
      const segunda = new Date(hoje);
      segunda.setDate(hoje.getDate() + distSegunda);

      for (let i = 0; i < 5; i++) {
        const dia = new Date(segunda);
        dia.setDate(segunda.getDate() + i);
        
        const formatado = String(dia.getDate()).padStart(2, '0') + '/' + 
                          String(dia.getMonth() + 1).padStart(2, '0') + '/' + 
                          dia.getFullYear();
        
        const elDate = document.getElementById(`date-${i}`);
        if (!localStorage.getItem(`date-${i}`)) {
          elDate.innerText = formatado;
        } else {
          elDate.innerText = localStorage.getItem(`date-${i}`);
        }

        // Carrega texto salvo
        const elContent = document.getElementById(`content-${i}`);
        if (localStorage.getItem(`content-${i}`)) {
          elContent.innerHTML = localStorage.getItem(`content-${i}`);
        }
      }
    }

    // Salva o conteúdo digitado automaticamente no navegador
    function salvarDados() {
      for (let i = 0; i < 5; i++) {
        const dateText = document.getElementById(`date-${i}`).innerText;
        const contentText = document.getElementById(`content-${i}`).innerHTML;
        localStorage.setItem(`date-${i}`, dateText);
        localStorage.setItem(`content-${i}`, contentText);
      }
    }

    window.onload = preencherDatas;
  </script>
</body>
</html>
