<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planejamento Semanal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: #333;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      font-size: 0.95rem;
    }

    /* Grid com 5 colunas para Segunda a Sexta */
    .planner-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .day-column {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #e1e4e8;
    }

    .day-header {
      background-color: #2c3e50;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .day-name {
      font-size: 1.1rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .day-date {
      font-size: 0.85rem;
      margin-top: 4px;
      opacity: 0.85;
      outline: none;
    }

    /* Conteúdo editável do dia */
    .day-content {
      padding: 15px;
      flex-grow: 1;
      min-height: 400px;
      outline: none;
      line-height: 1.6;
      color: #444;
      font-size: 0.95rem;
    }

    .day-content:focus, .day-date:focus {
      background-color: #fafbfc;
    }

    /* Dica visual ao passar o mouse */
    .day-content:hover {
      background-color: #f8f9fa;
    }

    @media (max-width: 900px) {
      .planner-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>📅 Meu Planejamento Semanal</h1>
    <p class="subtitle">Clique em qualquer lugar das colunas para digitar, editar ou adicionar suas tarefas.</p>
  </header>

  <main class="planner-grid">
    <div class="day-column">
      <div class="day-header">
        <div class="day-name">Segunda-feira</div>
        <div class="day-date" contenteditable="true" id="date-seg">--/--/----</div>
      </div>
      <div class="day-content" contenteditable="true" placeholder="Digite aqui...">
        • Tarefa 1<br>
        • Reunião às 10h<br>
      </div>
    </div>

    <div class="day-column">
      <div class="day-header">
        <div class="day-name">Terça-feira</div>
        <div class="day-date" contenteditable="true" id="date-ter">--/--/----</div>
      </div>
      <div class="day-content" contenteditable="true" placeholder="Digite aqui...">
      </div>
    </div>

    <div class="day-column">
      <div class="day-header">
        <div class="day-name">Quarta-feira</div>
        <div class="day-date" contenteditable="true" id="date-qua">--/--/----</div>
      </div>
      <div class="day-content" contenteditable="true" placeholder="Digite aqui...">
      </div>
    </div>

    <div class="day-column">
      <div class="day-header">
        <div class="day-name">Quinta-feira</div>
        <div class="day-date" contenteditable="true" id="date-qui">--/--/----</div>
      </div>
      <div class="day-content" contenteditable="true" placeholder="Digite aqui...">
      </div>
    </div>

    <div class="day-column">
      <div class="day-header">
        <div class="day-name">Sexta-feira</div>
        <div class="day-date" contenteditable="true" id="date-sex">--/--/----</div>
      </div>
      <div class="day-content" contenteditable="true" placeholder="Digite aqui...">
      </div>
    </div>
  </main>

  <script>
    // Função para preencher automaticamente as datas da semana atual
    function preencherDatasDaSemana() {
      const hoje = new Date();
      const diaDaSemana = hoje.getDay(); // 0 = Domingo, 1 = Segunda, ...
      
      // Calcula a data de segunda-feira da semana atual
      const distanciaParaSegunda = diaDaSemana === 0 ? -6 : 1 - diaDaSemana;
      const segunda = new Date(hoje);
      segunda.setDate(hoje.getDate() + distanciaParaSegunda);

      const ids = ['date-seg', 'date-ter', 'date-qua', 'date-qui', 'date-sex'];

      ids.forEach((id, index) => {
        const dataDia = new Date(segunda);
        dataDia.setDate(segunda.getDate() + index);

        const diaFormatado = String(dataDia.getDate()).padStart(2, '0');
        const mesFormatado = String(dataDia.getMonth() + 1).padStart(2, '0');
        const anoFormatado = dataDia.getFullYear();

        document.getElementById(id).innerText = `${diaFormatado}/${mesFormatado}/${anoFormatado}`;
      });
    }

    // Executa ao carregar a página
    window.onload = preencherDatasDaSemana;
  </script>

</body>
</html>
